scripts:
  opener: "Salut, j'ai vu que tu t'intéresses aux signaux. Tu trades depuis combien de temps ?"
  qualify_level: "Tu dirais que t'es débutant, intermédiaire ou confirmé en trading ?"
  qualify_budget: "Tu as quel budget mensuel pour les signaux ?"
  qualify_markets: "Tu trades quoi comme marchés ? Crypto, Forex, Actions ?"
  qualify_urgency: "Tu veux commencer maintenant ou tu te renseignes pour plus tard ?"
  pricing: "Nos abonnements commencent à 49€/mois pour les signaux crypto, 99€ pour full markets."
  handoff: "Parfait, je te mets en contact avec notre trader qui va te donner les détails."
  trial: "On propose un essai 7 jours à 1€ si tu veux tester avant de t'abonner."
  close_lost: "Pas de souci, si tu changes d'avis n'hésite pas à revenir."
  no_reply: "Je relance rapidement, toujours intéressé par nos signaux ?"
  follow_up_1: "Toujours chaud pour tester nos signaux ? On a eu des perf' à +180% cette semaine."
  follow_up_2: "Petit message pour te dire que nos signaux BTC sont à +12% cette semaine 👀"
  follow_up_3: "Dernière chance pour l'essai à 1€, l'offre se termine bientôt."